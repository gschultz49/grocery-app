services:
  # Development: React + Python with hot reload
  app-dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"   # Vite dev server
      - "3001:3001"   # Python API
    volumes:
      - ./client/src:/app/client/src:ro
      - ./api:/app/api:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - API_PORT=3001
      - VITE_API_URL=http://localhost:3001

  # Production: Nginx + Python API
  app-prod:
    build:
      context: .
      target: production
    ports:
      - "80:80"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - API_PORT=3001
    profiles:
      - prod
